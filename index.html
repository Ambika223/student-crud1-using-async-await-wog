<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Crud using Async Await wog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container py-5">
        <h3 class="mb-3 text-center bg-info">Student Crud using async await</h3>
        <div class="row">
            <div class="col-5">
                <div class="card">
                    <div class="card-header">
                        <h4>Student Info</h4>
                    </div>
                    <div class="card-body">
                        <form action="" id="studentForm">
                            <div class="form-group">
                                <label for="fname">First Name</label>
                                <input type="text" id="fname" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="lname">Last Name</label>
                                <input type="text" id="lname" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="age">Age</label>
                                <input type="number" id="age" class="form-control" min="1" required>
                            </div>

                            <div class="form-group">
                                <label for="course">course</label>
                                <select id="course" class="form-control">
                                    <option value="">Select Course</option>
                                    <option value="BE">BE</option>
                                    <option value="BCA">BCA</option>
                                    <option value="BCom">BCom</option>
                                    <option value="MCom">MCom</option>
                                    <option value="BSc">BSc</option>
                                </select>
                            </div>


                            <button type="submit" class="btn btn-primary btn-block mt-3" id="addstdBtn">Add
                                Todo</button>
                            <button type="button" class="btn btn-info  btn-block d-none" id="updatestdBtn">Update
                                Todo</button>

                        </form>
                    </div>
                </div>
            </div>

            <div class="col-7">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th>Sr No</th>
                                        <th>First Name</th>
                                        <th>Last Name</th>
                                        <th>Email</th>
                                        <th>Age</th>
                                        <th>Course</th>
                                        <th>Edit</th>
                                        <th>delete</th>
                                    </tr>
                                </thead>

                                <tbody id="stdContainer">
                                    <!-- <tr>
                                        <td>1</td>
                                        <td>John</td>
                                        <td>Doe</td>
                                        <td>jd@gmail.com</td>
                                        <td>22</td>
                                        <td>Bsc</td>
                                        <td><button type="click" class="btn btn-sm btn-success">Edit</button></td>
                                        <td><button type="click" class="btn btn-sm btn-danger">Remove</button></td>
                                    </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
